spring.application.name=norte

# Credenciais lidas de variaveis de ambiente (nunca salvas no codigo).
# Localmente: configure DB_URL, DB_USER e DB_PASSWORD na Run Configuration do IntelliJ.
# No Render: Environment Variables do Web Service.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexoes: o Oracle da FIAP limita conexoes por usuario
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1

# O Render informa a porta pela variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
